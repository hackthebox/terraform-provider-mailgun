# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  # Maintain dependencies for Go modules
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      # Check for updates to Go modules every weekday
      interval: "daily"
    # changelog-not-required satisfies the Changelog Entry gate, which Dependabot
    # cannot otherwise pass: it writes no .changelog entry. Listing the defaults
    # explicitly is required, since labels: replaces them rather than adding.
    labels:
      - "dependencies"
      - "go"
      - "changelog-not-required"
    groups:
      # The terraform-plugin-* packages are interdependent and share a minimum
      # Go version, so they must be bumped together (a lone bump fails to build).
      terraform-plugin:
        patterns:
          - "github.com/hashicorp/terraform-plugin-*"
      # Everything else in the main module (runtime SDK + indirect deps).
      go-modules:
        patterns:
          - "*"
        exclude-patterns:
          - "github.com/hashicorp/terraform-plugin-*"
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "go"
      - "changelog-not-required"
    # /tools deps all touch the same go.sum; grouping avoids a rebase cascade.
    groups:
      tools:
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github_actions"
      - "changelog-not-required"
    groups:
      github-actions:
        patterns:
          - "*"
